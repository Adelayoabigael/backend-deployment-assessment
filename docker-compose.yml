version: '3.8'

services:
  backend:
    build: .
    container_name: muchtodo-api
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://db:27017/much-to-do
      - PORT=8080
    restart: always
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:6.0
    container_name: muchtodo-db
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
